<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stranger Chat - Free Video Chat with Strangers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#111;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{height:50px;background:#222;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #333}
.logo{font-weight:900;font-size:20px}.logo b{color:#6cb6ff}
#welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;text-align:center;padding:20px}
#welcome h1{font-size:36px;margin-bottom:8px}
#welcome p{color:#888;margin-bottom:30px}
.btns{display:flex;gap:12px}
.main-btn{padding:16px 28px;border-radius:10px;border:2px solid #444;background:#222;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.main-btn.video{background:#1c3350;border-color:#4da6ff;color:#4da6ff}

/* TEXT CHAT - SEPARATE */
#textMode{display:none;flex:1;flex-direction:column;background:#111}
#textTop{background:#222;padding:10px;text-align:center;color:#0f8;font-size:13px;font-weight:700}
#textMsgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px}
#textBottom{display:flex;gap:6px;padding:10px;background:#222;border-top:1px solid #333}
#textBottom input{flex:1;padding:12px 15px;border-radius:20px;border:none;background:#333;color:#fff;outline:none}

/* VIDEO CHAT - SEPARATE FULL SCREEN */
#videoMode{display:none;flex:1;position:relative;background:#000;flex-direction:column}
#remoteVideo{width:100%;height:100%;object-fit:cover;background:#000}
#localVideo{position:absolute;right:12px;bottom:130px;width:120px;height:90px;border-radius:10px;border:2px solid #fff;object-fit:cover;background:#222;z-index:5}
#vChatOverlay{position:absolute;left:0;right:0;top:0;bottom:120px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#vBottomBar{position:absolute;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;padding:8px;z-index:10}
#vMsgRow{display:flex;gap:6px;margin-bottom:8px}
#vMsgRow input{flex:1;padding:10px 14px;border-radius:20px;border:none;background:#2a2a2a;color:#fff;outline:none}
#vBtnRow{display:flex;gap:8px;justify-content:center}
.vbtn{padding:10px 18px;border-radius:20px;border:none;font-weight:800;cursor:pointer;font-size:13px;min-width:65px}
.vbtn-mute{background:#333;color:#fff}.vbtn-cam{background:#333;color:#fff}.vbtn-next{background:#ff3b30;color:#fff;min-width:80px}.vbtn-stop{background:#444;color:#fff}

.msg{padding:8px 12px;border-radius:16px;max-width:75%;font-size:13px}
.me{background:#0084ff;align-self:flex-end}.them{background:#2e2e2e;align-self:flex-start}.sys{align-self:center;background:#222;color:#777;font-size:11px}
.sbtn{padding:10px 16px;border-radius:20px;border:none;font-weight:700;cursor:pointer;font-size:13px}
.sbtn-stop{background:#333;color:#fff}.sbtn-next{background:#ff3b30;color:#fff}.sbtn-send{background:#0084ff;color:#fff}
</style>
</head>
<body>
<div class="header"><div class="logo">STRANGER<b>CHAT</b></div><div style="color:#0f8;font-size:12px">● LIVE</div></div>

<div id="welcome">
<h1>Talk to Strangers!</h1>
<p>Omegle Alternative - 100% Free</p>
<div class="btns">
<button class="main-btn" onclick="openMode('text')">💬 Text Chat</button>
<button class="main-btn video" onclick="openMode('video')">🎥 Video Chat</button>
</div>
</div>

<!-- TEXT ONLY -->
<div id="textMode">
<div id="textTop">Connecting...</div>
<div id="textMsgs"></div>
<div id="textBottom">
<button class="sbtn sbtn-stop" onclick="location.reload()">Stop</button>
<button class="sbtn sbtn-next" onclick="doNext()">Next</button>
<input id="tInput" placeholder="Type a message...">
<button class="sbtn sbtn-send" onclick="send()">Send</button>
</div>
</div>

<!-- VIDEO ONLY -->
<div id="videoMode">
<video id="remoteVideo" autoplay playsinline></video>
<video id="localVideo" autoplay playsinline muted></video>
<div id="vChatOverlay"></div>
<div id="vBottomBar">
<div id="vMsgRow"><input id="vInput" placeholder="Type a message..."><button class="sbtn sbtn-send" onclick="send()">Send</button></div>
<div id="vBtnRow">
<button class="vbtn vbtn-mute" id="bMute" onclick="doMute()">Mute</button>
<button class="vbtn vbtn-cam" id="bCam" onclick="doCam()">Cam Off</button>
<button class="vbtn vbtn-next" onclick="doNext()">Next</button>
<button class="vbtn vbtn-stop" onclick="location.reload()">Stop</button>
</div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
let mode=null, localStream=null, peer=null, muted=false, camOff=false;
const remoteVideo=document.getElementById('remoteVideo'), localVideo=document.getElementById('localVideo');

function openMode(m){
 mode=m;
 document.getElementById('welcome').style.display='none';
 if(m==='text'){document.getElementById('textMode').style.display='flex';}
 else{document.getElementById('videoMode').style.display='flex'; startCam();}
 socket.emit('find-stranger',{mode});
 updateStatus('Searching...');
}
async function startCam(){
 try{
  localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  localVideo.srcObject=localStream;
 }catch(e){alert('Camera Allow करो! Chrome में खोलो'); location.reload();}
}
function updateStatus(t){
 if(mode==='text') document.getElementById('textTop').textContent=t;
 else {const d=document.createElement('div'); d.className='msg sys'; d.textContent=t; document.getElementById('vChatOverlay').appendChild(d);}
}
function box(){return mode==='text'?document.getElementById('textMsgs'):document.getElementById('vChatOverlay');}
function addMsg(t,cls){
 const b=box(); const div=document.createElement('div'); div.className='msg '+cls; div.textContent=t; b.appendChild(div); b.scrollTop=b.scrollHeight;
}
function send(){
 const inp=mode==='text'?document.getElementById('tInput'):document.getElementById('vInput');
 if(!inp.value.trim()) return;
 addMsg(inp.value,'me'); socket.emit('chat-message',inp.value); inp.value='';
}
function doNext(){
 if(peer){peer.close();peer=null;} if(remoteVideo) remoteVideo.srcObject=null;
 socket.emit('next-stranger',{mode}); updateStatus('Searching...'); box().innerHTML=''; socket.emit('find-stranger',{mode});
}
document.getElementById('tInput').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
document.getElementById('vInput').addEventListener('keydown',e=>{if(e.key==='Enter')send();});

socket.on('waiting',()=>updateStatus('Waiting for stranger...'));
socket.on('matched',async d=>{
 updateStatus('Connected! Say Hi 👋');
 addMsg('You are now connected to a stranger!','sys');
 if(mode==='video'){ await makePeer(); if(d.initiator){const o=await peer.createOffer(); await peer.setLocalDescription(o); socket.emit('webrtc-offer',o);}}
});
socket.on('chat-message',m=>addMsg(m,'them'));
socket.on('partner-left',()=>{updateStatus('Stranger disconnected. Click Next.'); addMsg('Stranger disconnected','sys'); if(peer){peer.close();peer=null;} remoteVideo.srcObject=null;});

async function makePeer(){
 if(peer) peer.close();
 peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
 if(localStream) localStream.getTracks().forEach(tr=>peer.addTrack(tr,localStream));
 peer.ontrack=e=>{ console.log('GOT REMOTE VIDEO'); remoteVideo.srcObject=e.streams[0]; };
 peer.onicecandidate=e=>{ if(e.candidate) socket.emit('ice-candidate',e.candidate); };
}
socket.on('webrtc-offer',async o=>{await makePeer(); await peer.setRemoteDescription(o); const a=await peer.createAnswer(); await peer.setLocalDescription(a); socket.emit('webrtc-answer',a);});
socket.on('webrtc-answer',async a=>{if(peer) await peer.setRemoteDescription(a);});
socket.on('ice-candidate',async c=>{if(peer) try{await peer.addIceCandidate(c);}catch(e){}}});

function doMute(){ if(!localStream) return; muted=!muted; localStream.getAudioTracks().forEach(t=>t.enabled=!muted); document.getElementById('bMute').textContent=muted?'Unmute':'Mute';}
function doCam(){ if(!localStream) return; camOff=!camOff; localStream.getVideoTracks().forEach(t=>t.enabled=!camOff); document.getElementById('bCam').textContent=camOff?'Cam On':'Cam Off';}
</script>
</body>
</html>
