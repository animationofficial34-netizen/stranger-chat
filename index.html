<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stranger Chat - Talk to Strangers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', sans-serif}
body{background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column}
.header{background:#1a1a1a;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}
.logo{font-weight:900;font-size:22px;letter-spacing:1px}
.logo span{color:#4da6ff}
.online{font-size:13px;background:#222;padding:6px 12px;border-radius:20px}
.online b{color:#00ff88}
.main{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
#welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#welcome h1{font-size:38px;margin-bottom:10px}
#welcome p{color:#aaa;margin-bottom:25px;max-width:500px}
.modes{display:flex;gap:15px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.mode-btn{padding:18px 35px;border-radius:15px;border:2px solid #333;background:#1e1e1e;color:#fff;font-weight:700;font-size:16px;cursor:pointer;transition:0.2s}
.mode-btn:hover{transform:scale(1.05);border-color:#4da6ff}
.mode-btn.video{border-color:#4da6ff;background:linear-gradient(135deg,#1a2a4a,#1e1e1e)}
#chatArea{display:none;flex:1;flex-direction:column;height:100%}
#videoArea{display:none;flex:1;background:#000;position:relative}
#remoteVideo{width:100%;height:100%;object-fit:cover;background:#111}
#localVideo{position:absolute;bottom:100px;right:15px;width:130px;height:100px;border-radius:12px;border:2px solid #fff;object-fit:cover;background:#222;z-index:10}
#statusBar{background:#1a1a1a;padding:10px;text-align:center;font-size:14px;color:#00ff88;border-bottom:1px solid #333}
#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;background:#0f0f0f}
.msg{padding:10px 14px;border-radius:18px;max-width:75%;word-break:break-word;line-height:1.4}
.me{background:#0084ff;align-self:flex-end;border-bottom-right-radius:4px}
.them{background:#2a2a2a;align-self:flex-start;border-bottom-left-radius:4px}
.system{align-self:center;background:#1a1a1a;color:#aaa;font-size:13px;padding:6px 12px;border-radius:20px}
#typing{height:20px;padding:0 15px;color:#888;font-size:12px;font-style:italic}
#controls{background:#1a1a1a;padding:12px;display:flex;gap:8px;align-items:center;border-top:1px solid #333}
#controls input{flex:1;padding:12px 18px;border-radius:25px;border:none;background:#2a2a2a;color:#fff;outline:none;font-size:15px}
#controls button{padding:11px 20px;border-radius:25px;border:none;font-weight:700;cursor:pointer}
#sendBtn{background:#0084ff;color:#fff}
#nextBtn{background:#ff3b30;color:#fff}
#stopBtn{background:#333;color:#fff}
.video-controls{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:20}
.v-btn{padding:12px 20px;border-radius:30px;border:none;font-weight:700;cursor:pointer;background:#222;color:#fff}
.v-btn.end{background:#ff3b30}
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:15px}
.tag{background:#222;padding:6px 12px;border-radius:20px;font-size:13px;color:#ccc}
</style>
</head>
<body>
<div class="header">
<div class="logo">STRANGER<span>CHAT</span></div>
<div class="online"><b>●</b> <span id="count">1247</span> Online</div>
</div>
<div class="main">
<div id="welcome">
<h1>Talk to Strangers!</h1>
<p>Meet new people, make friends. No login needed. Just click Start.</p>
<div class="modes">
<button class="mode-btn" onclick="startChat('text')">💬 Text Chat</button>
<button class="mode-btn video" onclick="startChat('video')">🎥 Video Chat</button>
</div>
<div class="tags"><div class="tag">#India</div><div class="tag">#Friendship</div><div class="tag">#Random</div><div class="tag">#Dating</div></div>
<p style="margin-top:25px;font-size:12px;color:#666">By starting you agree to be 18+ and follow rules.</p>
</div>

<div id="chatArea">
<div id="statusBar">Connecting...</div>
<div id="messages"></div>
<div id="typing"></div>
<div id="controls">
<button id="stopBtn" onclick="stopChat()">Stop</button>
<button id="nextBtn" onclick="nextStranger()">Next</button>
<input id="msgInput" placeholder="Type a message...">
<button id="sendBtn" onclick="sendMsg()">Send</button>
</div>
</div>

<div id="videoArea">
<video id="remoteVideo" autoplay playsinline></video>
<video id="localVideo" autoplay playsinline muted></video>
<div class="video-controls">
<button class="v-btn" onclick="toggleMute()" id="muteBtn">Mute</button>
<button class="v-btn" onclick="toggleCam()" id="camBtn">Cam Off</button>
<button class="v-btn end" onclick="nextStranger()">Next</button>
<button class="v-btn" onclick="stopChat()">Stop</button>
</div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let mode='text';
let localStream, peer, isMuted=false, isCamOff=false;
const welcome=document.getElementById('welcome');
const chatArea=document.getElementById('chatArea');
const videoArea=document.getElementById('videoArea');
const messages=document.getElementById('messages');
const statusBar=document.getElementById('statusBar');
const msgInput=document.getElementById('msgInput');
const typingDiv=document.getElementById('typing');
const remoteVideo=document.getElementById('remoteVideo');
const localVideo=document.getElementById('localVideo');

function startChat(m){
 mode=m;
 welcome.style.display='none';
 if(m==='text'){
  chatArea.style.display='flex';
  videoArea.style.display='none';
 } else {
  chatArea.style.display='flex';
  chatArea.style.height='45%';
  videoArea.style.display='flex';
  videoArea.style.height='55%';
  startCamera();
 }
 findStranger();
}
function findStranger(){
 messages.innerHTML='';
 statusBar.textContent='Searching for a stranger...';
 socket.emit('find-stranger',{mode});
}
function stopChat(){
 socket.emit('next-stranger',{mode});
 if(peer){peer.close();peer=null;}
 if(localStream){localStream.getTracks().forEach(t=>t.stop());}
 location.reload();
}
function nextStranger(){
 if(peer){peer.close();peer=null;}
 messages.innerHTML='';
 statusBar.textContent='Finding next stranger...';
 typingDiv.textContent='';
 socket.emit('next-stranger',{mode});
}

function addMsg(t,who){
 const d=document.createElement('div');
 d.className='msg '+who; d.textContent=t;
 messages.appendChild(d);
 messages.scrollTop=messages.scrollHeight;
}

function sendMsg(){
 if(!msgInput.value.trim())return;
 addMsg(msgInput.value,'me');
 socket.emit('chat-message',msgInput.value);
 socket.emit('typing',false);
 msgInput.value='';
}
msgInput.addEventListener('keypress',e=>{ if(e.key==='Enter')sendMsg(); });
let typingTimer;
msgInput.addEventListener('input',()=>{
 socket.emit('typing',true);
 clearTimeout(typingTimer);
 typingTimer=setTimeout(()=>socket.emit('typing',false),1000);
});

socket.on('waiting',()=>statusBar.textContent='Waiting for someone...');
socket.on('matched',async (data)=>{
 statusBar.textContent='Stranger connected! Say Hi 👋';
 addMsg('You are now connected to a stranger!','system');
 if(mode==='video'){
   if(data.initiator) await createOffer();
 }
});
socket.on('chat-message',m=>{addMsg(m,'them');});
socket.on('typing',is=>{typingDiv.textContent=is?'Stranger is typing...':'';});
socket.on('partner-left',()=>{
 statusBar.textContent='Stranger disconnected. Click Next.';
 addMsg('Stranger disconnected','system');
 typingDiv.textContent='';
 if(peer){peer.close();peer=null;}
 if(mode==='video'){remoteVideo.srcObject=null;}
});
socket.on('searching-again',()=>findStranger());

// Video Logic
async function startCamera(){
 try{
  localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  localVideo.srcObject=localStream;
 }catch(e){alert('Camera Mic allow karo');}
}
async function createPeer(){
 peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 if(localStream) localStream.getTracks().forEach(t=>peer.addTrack(t,localStream));
 peer.onicecandidate=e=>{ if(e.candidate) socket.emit('ice-candidate',e.candidate); };
 peer.ontrack=e=>{ remoteVideo.srcObject=e.streams[0]; };
 return peer;
}
async function createOffer(){
 const p=await createPeer();
 const offer=await p.createOffer();
 await p.setLocalDescription(offer);
 socket.emit('webrtc-offer',offer);
}
socket.on('webrtc-offer',async offer=>{
 const p=await createPeer();
 await p.setRemoteDescription(offer);
 const answer=await p.createAnswer();
 await p.setLocalDescription(answer);
 socket.emit('webrtc-answer',answer);
});
socket.on('webrtc-answer',async answer=>{
 if(peer) await peer.setRemoteDescription(answer);
});
socket.on('ice-candidate',async cand=>{
 if(peer) try{await peer.addIceCandidate(cand);}catch(e){}
});
function toggleMute(){
 if(!localStream)return;
 isMuted=!isMuted;
 localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted);
 document.getElementById('muteBtn').textContent=isMuted?'Unmute':'Mute';
}
function toggleCam(){
 if(!localStream)return;
 isCamOff=!isCamOff;
 localStream.getVideoTracks().forEach(t=>t.enabled=!isCamOff);
 document.getElementById('camBtn').textContent=isCamOff?'Cam On':'Cam Off';
}
// fake online count animation
setInterval(()=>{document.getElementById('count').textContent= Math.floor(1200+Math.random()*300)},3000);
</script>
</body>
</html>
