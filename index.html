<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stranger Chat - India</title>
<style>
body{font-family:Arial;background:#000;color:white;display:flex;flex-direction:column;height:100vh;margin:0}
#status{background:#222;padding:12px;text-align:center;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 14px;border-radius:18px;max-width:75%;word-wrap:break-word}
.me{background:#0084ff;align-self:flex-end}
.them{background:#333;align-self:flex-start}
#controls{padding:12px;display:flex;gap:8px;background:#222;align-items:center}
button{padding:10px 18px;border:none;border-radius:20px;background:#0084ff;color:white;font-weight:bold;cursor:pointer}
#nextBtn{background:#ff3b30}
input{flex:1;padding:12px;border-radius:20px;border:none;outline:none}
</style>
</head>
<body>
<div id="status">Start दबाओ, Stranger से बात करो</div>
<div id="chat"></div>
<div id="controls">
<button id="startBtn">Start</button>
<button id="nextBtn">Next</button>
<input id="msgInput" placeholder="Message लिखो...">
<button id="sendBtn">Send</button>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const chat = document.getElementById('chat');
const status = document.getElementById('status');
function addMsg(t,w){const d=document.createElement('div');d.className='msg '+w;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
document.getElementById('startBtn').onclick=()=>{socket.emit('find-stranger');status.textContent='Stranger ढूंढ रहा हूँ...';chat.innerHTML='';}
document.getElementById('nextBtn').onclick=()=>{socket.emit('next-stranger');status.textContent='Next ढूंढ रहा हूँ...';chat.innerHTML='';}
function send(){const i=document.getElementById('msgInput');if(!i.value)return;addMsg(i.value,'me');socket.emit('chat-message',i.value);i.value='';}
document.getElementById('sendBtn').onclick=send;
document.getElementById('msgInput').onkeypress=e=>{if(e.key==='Enter')send();}
socket.on('waiting',()=>status.textContent='Wait करो, Stranger का इंतजार...');
socket.on('matched',()=>{status.textContent='Connected! बात करो';addMsg('Stranger जुड़ गया!','them');});
socket.on('chat-message',m=>addMsg(m,'them'));
socket.on('partner-left',()=>status.textContent='Stranger चला गया, Start दबाओ');
socket.on('searching-again',()=>socket.emit('find-stranger'));
</script>
</body>
</html>
